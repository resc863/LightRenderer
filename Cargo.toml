[package]
name = "light-renderer"
version = "0.1.0"
edition = "2024"
description = "Interactive DirectX 12 / DXR anime cel-shading garden"
build = "build.rs"
default-run = "light-renderer"

[features]
# Compare the same physics implementation with glam's portable scalar backend.
physics-scalar = ["glam/scalar-math"]

[[bench]]
name = "physics"
harness = false

[[bench]]
name = "fluid"
harness = false

[dependencies]
anyhow = "1"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi", "Win32_Security"
] }

[profile.release]
lto = "thin"
codegen-units = 1
